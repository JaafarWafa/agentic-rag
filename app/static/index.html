<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic RAG</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1c1d1f;--muted:#6b6e76;--line:#e3e3df;--accent:#2f5bd3;--accent-soft:#e8eefc;
--ok:#1f7a4d;--ok-soft:#e3f3ea;--warn:#a6531a;--warn-soft:#fbeee2;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--panel:#1c1d20;--ink:#e8e8e6;--muted:#9a9ca3;--line:#2c2d31;
--accent:#7c9cff;--accent-soft:#232b45;--ok:#5fcf98;--ok-soft:#1c3328;--warn:#f0a36b;--warn-soft:#3a2a1e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:17px;margin:0;letter-spacing:-.01em}h1 span{color:var(--muted);font-weight:400}
nav button{background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--muted);font:inherit;cursor:pointer}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{max-width:1060px;margin:0 auto;padding:20px 16px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{font-size:13px;color:var(--muted)}select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
textarea{width:100%;resize:vertical;min-height:64px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;background:var(--panel)}
.chip:hover{border-color:var(--accent)}
.answer{font-size:16px;white-space:pre-wrap}.cite{color:var(--accent);font-weight:600;cursor:pointer;font-size:13px;vertical-align:1px}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:5px;padding:2px 8px}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-info{background:var(--accent-soft);color:var(--accent)}
.meta{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.src{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0;font-size:14px}.src.hl{border-color:var(--accent);background:var(--accent-soft)}
.src b{font-size:13px}.step{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}.step code{font-family:var(--mono);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}td.num{font-variant-numeric:tabular-nums;text-align:right}
.hidden{display:none}.scroll{overflow-x:auto}svg text{fill:var(--muted);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>Agentic RAG <span id="cfg"></span></h1>
  <nav id="tabs"><button data-t="ask" class="on">Ask</button><button data-t="docs">Documents</button><button data-t="traces">Traces</button><button data-t="evals">Evals</button></nav>
  <div class="row"><label for="role">Acting as</label>
    <select id="role">
      <option value="public-demo-key">public</option><option value="employee-demo-key" selected>employee</option>
      <option value="hr-demo-key">hr</option><option value="legal-demo-key">legal</option><option value="admin-demo-key">admin</option>
    </select></div>
</header>
<main>
<section id="t-ask">
  <div class="panel">
    <textarea id="q" placeholder="Ask about company policy…">How many days per week can I work remotely?</textarea>
    <div class="row" style="margin-top:10px;justify-content:space-between">
      <span class="meta">Switch role to see access control: HR and legal documents are invisible to employees.</span>
      <button class="btn" id="go">Ask</button>
    </div>
    <div class="chips" id="examples"></div>
  </div>
  <div class="grid hidden" id="result">
    <div class="panel"><div class="row" id="status"></div><p class="answer" id="answer"></p><div id="sources"></div></div>
    <div class="panel"><b>Agent trace</b> <span class="meta" id="tid"></span><div id="steps"></div></div>
  </div>
</section>

<section id="t-docs" class="hidden">
  <div class="panel" id="upload-panel">
    <b>Upload a document</b> <span class="meta">(admin; pdf, html, md, txt)</span>
    <form id="up" class="row" style="margin-top:10px">
      <input type="file" name="file" required>
      <input name="allowed_roles" value="employee" title="comma-separated roles" style="width:170px">
      <button class="btn">Upload</button><span class="meta" id="upmsg"></span>
    </form>
  </div>
  <div class="panel scroll"><table id="doctable"></table></div>
</section>

<section id="t-traces" class="hidden"><div class="panel scroll"><span class="meta">Admin only. Every query is logged with its agent steps.</span><table id="tracetable"></table></div></section>

<section id="t-evals" class="hidden">
  <div class="panel"><b>Quality over iterations</b> <span class="meta">from the eval_runs table</span><div id="chart"></div></div>
  <div class="panel scroll"><table id="evaltable"></table></div>
</section>
</main>
<script>
const $ = s => document.querySelector(s);
const key = () => $("#role").value;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = (path, opts = {}) => fetch(path, {...opts, headers: {"X-API-Key": key(), ...(opts.headers || {})}})
  .then(async r => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status); return r.status === 204 ? null : r.json(); });

const EXAMPLES = ["How much PTO do I get?", "What is the nightly hotel cap abroad?", "What is the salary range for Band C?",
  "How long do custodians have to acknowledge a litigation hold notice?", "Does the company match pension contributions?",
  "Can I accept a gift card from a supplier?"];
$("#examples").innerHTML = EXAMPLES.map(e => `<span class="chip">${esc(e)}</span>`).join("");
$("#examples").onclick = e => { if (e.target.classList.contains("chip")) { $("#q").value = e.target.textContent; ask(); } };

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["ask","docs","traces","evals"].forEach(t => $("#t-" + t).classList.toggle("hidden", t !== b.dataset.t));
  ({docs: loadDocs, traces: loadTraces, evals: loadEvals})[b.dataset.t]?.();
});
$("#role").onchange = () => { const t = document.querySelector("#tabs .on").dataset.t; if (t !== "ask") document.querySelector(`[data-t=${t}]`).click(); };

fetch("/health").then(r => r.json()).then(h => $("#cfg").textContent = `· ${h.llm} · ${h.store} · ${h.chunks} chunks`);

async function ask() {
  const q = $("#q").value.trim(); if (!q) return;
  $("#go").disabled = true;
  try {
    const r = await api("/query", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question: q})});
    render(r);
  } catch (e) { alert(e.message); } finally { $("#go").disabled = false; }
}
$("#go").onclick = ask;
$("#q").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask(); };

function render(r) {
  $("#result").classList.remove("hidden");
  const badge = r.refused ? `<span class="badge b-warn">refused, not in accessible documents</span>`
    : r.route === "direct" ? `<span class="badge b-info">direct answer, no retrieval</span>`
    : `<span class="badge b-ok">grounded answer · ${r.citations.length} citation(s)</span>`;
  $("#status").innerHTML = `${badge}<span class="meta">${r.latency_ms} ms · ${esc(r.provider)}</span>`;
  $("#answer").innerHTML = esc(r.answer).replace(/\[(c\d+)\]/g, '<span class="cite" data-m="$1">[$1]</span>');
  $("#sources").innerHTML = r.citations.map(c => `<div class="src" id="src-${c.marker}"><b>[${c.marker}] ${esc(c.doc_title)}</b>
    <span class="meta"> › ${esc(c.section)}${c.page ? ` · p.${c.page}` : ""} · score ${c.score}</span><div>${esc(c.text)}</div></div>`).join("");
  document.querySelectorAll(".cite").forEach(el => el.onclick = () => {
    document.querySelectorAll(".src").forEach(s => s.classList.remove("hl"));
    const s = $("#src-" + el.dataset.m); if (s) { s.classList.add("hl"); s.scrollIntoView({block: "nearest", behavior: "smooth"}); }
  });
  $("#tid").textContent = "trace " + r.trace_id;
  $("#steps").innerHTML = r.steps.map(s => {
    let body = "";
    if (s.type === "search") body = `<code>${esc(s.query)}</code> → best ${s.best_score}<br>` + s.results.slice(0, 4)
      .map(x => `<span class="meta">${x.score.toFixed(2)} ${esc(x.doc)} › ${esc(x.section)}</span>`).join("<br>");
    else if (s.type === "grade") body = `${s.verdict} (best ${s.best_score} vs threshold ${s.threshold})${s.next ? " → " + s.next : ""}`;
    else if (s.type === "route") body = `${s.decision}: ${esc(s.reason)}`;
    else if (s.type === "guardrail") body = `<span class="badge b-warn">${esc(s.rule)}</span>`;
    else if (s.type === "llm") body = `stop=${s.stop_reason} · in ${s.input_tokens} / out ${s.output_tokens} tok`;
    else if (s.type === "answer") body = s.refused ? "refused" : `cited ${s.citations.join(", ") || "none"}`;
    else body = esc(JSON.stringify(s));
    return `<div class="step"><b>${s.step}. ${s.type}</b> <span class="meta">+${s.t_ms} ms</span><br>${body}</div>`;
  }).join("");
}

async function loadDocs() {
  try {
    const docs = await api("/documents");
    $("#doctable").innerHTML = `<tr><th>Title</th><th>Source</th><th>Roles</th><th class="num">Chunks</th></tr>` +
      docs.map(d => `<tr><td>${esc(d.title)}</td><td class="meta">${esc(d.source)}</td><td>${d.allowed_roles.map(r => `<span class="badge b-info">${r}</span>`).join(" ")}</td><td class="num">${d.n_chunks}</td></tr>`).join("");
  } catch (e) { $("#doctable").innerHTML = `<tr><td>${esc(e.message)}</td></tr>`; }
}
$("#up").onsubmit = async e => {
  e.preventDefault(); $("#upmsg").textContent = "uploading…";
  try { const r = await api("/documents", {method: "POST", body: new FormData(e.target)});
    $("#upmsg").textContent = `${r.status}: ${r.n_chunks} chunks`; loadDocs(); }
  catch (err) { $("#upmsg").textContent = err.message; }
};

async function loadTraces() {
  try {
    const ts = await api("/traces?limit=100");
    $("#tracetable").innerHTML = `<tr><th>Time</th><th>User</th><th>Question</th><th>Outcome</th><th class="num">ms</th></tr>` +
      ts.map(t => `<tr><td class="meta">${esc(t.created_at.slice(0, 19).replace("T", " "))}</td><td>${esc(t.user)}</td><td>${esc(t.question)}</td>
      <td>${t.refused ? '<span class="badge b-warn">refused</span>' : `<span class="badge b-ok">${t.citations.length} cites</span>`}</td><td class="num">${Math.round(t.latency_ms)}</td></tr>`).join("");
  } catch (e) { $("#tracetable").innerHTML = `<tr><td>${esc(e.message)}. Switch to admin.</td></tr>`; }
}

async function loadEvals() {
  const runs = await api("/eval/runs");
  const cols = [["answer_accuracy","Accuracy"],["hallucination_rate","Halluc."],["false_refusal_rate","False refusal"],
    ["correct_refusal_rate","Correct refusal"],["mrr","MRR"],["citation_precision","Cite prec."],["rbac_leak_rate","RBAC leak"]];
  $("#evaltable").innerHTML = `<tr><th>Run</th><th>LLM</th>${cols.map(c => `<th class="num">${c[1]}</th>`).join("")}</tr>` +
    runs.map(r => `<tr><td>${esc(r.label)}<br><span class="meta">${esc(r.created_at.slice(0, 16))}</span></td><td class="meta">${esc(r.config.llm)}</td>
    ${cols.map(c => `<td class="num">${r.metrics[c[0]] ?? "–"}</td>`).join("")}</tr>`).join("");
  chart(runs);
}

function chart(runs) {
  if (!runs.length) { $("#chart").innerHTML = '<p class="meta">No runs yet: <code>python -m evals.run_eval --ablation</code></p>'; return; }
  const W = 640, H = 220, P = 36, series = [["answer_accuracy", "var(--accent)", "accuracy"], ["hallucination_rate", "var(--warn)", "hallucination rate"]];
  const x = i => P + (runs.length === 1 ? (W - 2 * P) / 2 : i * (W - 2 * P) / (runs.length - 1)), y = v => H - P - v * (H - 2 * P);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="accuracy and hallucination rate per eval run">`;
  [0, .25, .5, .75, 1].forEach(v => s += `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="4" y="${y(v) + 4}">${v * 100}%</text>`);
  series.forEach(([k, col, name], si) => {
    const pts = runs.map((r, i) => [x(i), y(r.metrics[k] ?? 0)]);
    s += `<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.map(p => p.join(",")).join(" ")}"/>`;
    pts.forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${col}"/>`);
    s += `<text x="${W - P - 150}" y="${16 + si * 15}" style="fill:${col}">● ${name}</text>`;
  });
  runs.forEach((r, i) => s += `<text x="${x(i)}" y="${H - 12}" text-anchor="middle">${esc(r.label.slice(0, 22))}</text>`);
  $("#chart").innerHTML = s + "</svg>";
}
</script>
</body>
</html>
