# Production-like local stack: API + Postgres/pgvector.
#   docker compose up --build   ->  http://localhost:8000
services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U rag"], interval: 3s, retries: 20}
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # empty -> offline extractive mode
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}
